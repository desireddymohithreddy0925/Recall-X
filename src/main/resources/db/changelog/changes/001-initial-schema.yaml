databaseChangeLog:
  - changeSet:
      id: 1
      author: recall-x
      changes:
        - createTable:
            tableName: system_health
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: status
                  type: varchar(255)
              - column:
                  name: checked_at
                  type: timestamp
                  defaultValueComputed: CURRENT_TIMESTAMP
